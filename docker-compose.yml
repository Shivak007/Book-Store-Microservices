version: '3.8'

services:
  # ── Infrastructure ─────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    volumes:
      - kafka-data:/var/lib/kafka/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # ── Databases ──────────────────────────────────────────────────
  user-db:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - user-db-data:/var/lib/postgresql/data

  admin-db:
    image: postgres:16
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: admin_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - admin-db-data:/var/lib/postgresql/data

  product-db:
    image: postgres:16
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - product-db-data:/var/lib/postgresql/data

  wishlist-db:
    image: postgres:16
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: wishlist_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - wishlist-db-data:/var/lib/postgresql/data

  customer-db:
    image: postgres:16
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - customer-db-data:/var/lib/postgresql/data

  order-db:
    image: postgres:16
    ports:
      - "5438:5432"
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - order-db-data:/var/lib/postgresql/data

  feedback-db:
    image: postgres:16
    ports:
      - "5439:5432"
    environment:
      POSTGRES_DB: feedback_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - feedback-db-data:/var/lib/postgresql/data

  # ── Spring Boot Services ───────────────────────────────────────
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    ports:
      - "8888:8888"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      JWT_SECRET: change-me-please-use-a-strong-256-bit-secret
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://user-db:5432/user_db
      DB_USER: admin
      DB_PASS: secret
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      KAFKA_BOOTSTRAP: kafka:9092
      JWT_SECRET: change-me-please-use-a-strong-256-bit-secret
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      user-db:
        condition: service_started
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  admin-service:
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://admin-db:5432/admin_db
      DB_USER: admin
      DB_PASS: secret
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      JWT_SECRET: change-me-please-use-a-strong-256-bit-secret
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      admin-db:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:postgresql://product-db:5432/product_db
      DB_USER: admin
      DB_PASS: secret
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      KAFKA_BOOTSTRAP: kafka:9092
      JWT_SECRET: change-me-please-use-a-strong-256-bit-secret
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      product-db:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  cart-service:
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      KAFKA_BOOTSTRAP: kafka:9092
      JWT_SECRET: change-me-please-use-a-strong-256-bit-secret
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  wishlist-service:
    build:
      context: .
      dockerfile: wishlist-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:postgresql://wishlist-db:5432/wishlist_db
      DB_USER: admin
      DB_PASS: secret
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      JWT_SECRET: change-me-please-use-a-strong-256-bit-secret
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      wishlist-db:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  customer-details-service:
    build:
      context: .
      dockerfile: customer-details-service/Dockerfile
    ports:
      - "8086:8086"
    environment:
      DB_URL: jdbc:postgresql://customer-db:5432/customer_db
      DB_USER: admin
      DB_PASS: secret
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      JWT_SECRET: change-me-please-use-a-strong-256-bit-secret
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      customer-db:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "8087:8087"
    environment:
      DB_URL: jdbc:postgresql://order-db:5432/order_db
      DB_USER: admin
      DB_PASS: secret
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      KAFKA_BOOTSTRAP: kafka:9092
      JWT_SECRET: change-me-please-use-a-strong-256-bit-secret
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      order-db:
        condition: service_started

        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8089/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  redis-data:
  user-db-data:
  admin-db-data:
  product-db-data:
  wishlist-db-data:
  customer-db-data:
  order-db-data:
  feedback-db-data:

networks:
  default:
    name: bookstore-network
